name: Publicar apenas arquivos aprovados no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "fluxo-caixa-diretoria/css/dashboard.css"
      - "fluxo-caixa-diretoria/css/financeiro.css"
      - "fluxo-caixa-diretoria/css/principal-extras.css"
      - "fluxo-caixa-diretoria/css/pendentes.css"
      - "fluxo-caixa-diretoria/css/centros.css"
      - "fluxo-caixa-diretoria/css/mensal.css"
      - "fluxo-caixa-diretoria/css/projecao.css"
      - "fluxo-caixa-diretoria/js/app.js"
      - "fluxo-caixa-diretoria/js/financeiro.js"
      - "fluxo-caixa-diretoria/js/principal-extras.js"
      - "fluxo-caixa-diretoria/js/pendentes.js"
      - "fluxo-caixa-diretoria/tests/pendentes-nufin.cjs"
      - "fluxo-caixa-diretoria/tests/projecao-periodo.cjs"
      - "fluxo-caixa-diretoria/tests/projecao-tooltip.cjs"
      - "fluxo-caixa-diretoria/tests/exercicio.cjs"
      - "fluxo-caixa-diretoria/tests/principal-projecao-unica.cjs"
      - "fluxo-caixa-diretoria/js/centros.js"
      - "fluxo-caixa-diretoria/js/mensal.js"
      - "fluxo-caixa-diretoria/js/exercicio.js"
      - "fluxo-caixa-diretoria/js/projecao.js"
      - "fluxo-caixa-diretoria/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter repositorio privado
        uses: actions/checkout@v4
      - name: Validar sintaxe dos modulos JavaScript
        shell: bash
        run: |
          node --check fluxo-caixa-diretoria/js/app.js
          node --check fluxo-caixa-diretoria/js/financeiro.js
          node --check fluxo-caixa-diretoria/js/principal-extras.js
          node --check fluxo-caixa-diretoria/js/pendentes.js
          node fluxo-caixa-diretoria/tests/pendentes-nufin.cjs
          node --check fluxo-caixa-diretoria/js/centros.js
          node --check fluxo-caixa-diretoria/js/mensal.js
          node --check fluxo-caixa-diretoria/js/exercicio.js
          node fluxo-caixa-diretoria/tests/exercicio.cjs
          node --check fluxo-caixa-diretoria/js/projecao.js
          node fluxo-caixa-diretoria/tests/projecao-periodo.cjs
          node fluxo-caixa-diretoria/tests/projecao-tooltip.cjs
          node fluxo-caixa-diretoria/tests/principal-projecao-unica.cjs
      - name: Criar distribuicao publica por lista de permissao
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site/fluxo-caixa-diretoria/css public-site/fluxo-caixa-diretoria/js
          cp fluxo-caixa-diretoria/css/dashboard.css public-site/fluxo-caixa-diretoria/css/dashboard.css
          cp fluxo-caixa-diretoria/css/financeiro.css public-site/fluxo-caixa-diretoria/css/financeiro.css
          cp fluxo-caixa-diretoria/css/principal-extras.css public-site/fluxo-caixa-diretoria/css/principal-extras.css
          cp fluxo-caixa-diretoria/css/pendentes.css public-site/fluxo-caixa-diretoria/css/pendentes.css
          cp fluxo-caixa-diretoria/css/centros.css public-site/fluxo-caixa-diretoria/css/centros.css
          cp fluxo-caixa-diretoria/css/mensal.css public-site/fluxo-caixa-diretoria/css/mensal.css
          cp fluxo-caixa-diretoria/css/projecao.css public-site/fluxo-caixa-diretoria/css/projecao.css
          cp fluxo-caixa-diretoria/js/app.js public-site/fluxo-caixa-diretoria/js/app.js
          cp fluxo-caixa-diretoria/js/financeiro.js public-site/fluxo-caixa-diretoria/js/financeiro.js
          cp fluxo-caixa-diretoria/js/principal-extras.js public-site/fluxo-caixa-diretoria/js/principal-extras.js
          cp fluxo-caixa-diretoria/js/pendentes.js public-site/fluxo-caixa-diretoria/js/pendentes.js
          cp fluxo-caixa-diretoria/js/centros.js public-site/fluxo-caixa-diretoria/js/centros.js
          cp fluxo-caixa-diretoria/js/mensal.js public-site/fluxo-caixa-diretoria/js/mensal.js
          cp fluxo-caixa-diretoria/js/exercicio.js public-site/fluxo-caixa-diretoria/js/exercicio.js
          cp fluxo-caixa-diretoria/js/projecao.js public-site/fluxo-caixa-diretoria/js/projecao.js
          cp fluxo-caixa-diretoria/index.html public-site/fluxo-caixa-diretoria/index.html

          # Cópia opcional do logotipo oficial informado pela P&R.
          # Falhas do servidor de recursos NÃO podem impedir o deploy do dashboard.
          mkdir -p public-site/fluxo-caixa-diretoria/assets
          BRAND_TMP="$(mktemp)"
          if curl --fail --location --silent --show-error --connect-timeout 8 --max-time 20 --max-filesize 200000 \
            "https://recursos.perautomacao.com.br/i/catus/logo_R.svg" --output "$BRAND_TMP" &&
            python3 - "$BRAND_TMP" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path(sys.argv[1])
          content = path.read_bytes()
          assert 30 < len(content) < 200000, "Dimensão de arquivo inválida"
          root = ET.fromstring(content)
          assert root.tag.rsplit("}", 1)[-1] == "svg", "O recurso não é SVG"
          prohibited = {"script", "foreignObject", "iframe", "object", "embed"}
          for node in root.iter():
              assert node.tag.rsplit("}", 1)[-1] not in prohibited, "SVG inclui elemento ativo"
              for name, value in node.attrib.items():
                  key = name.rsplit("}", 1)[-1].lower()
                  assert not key.startswith("on"), "SVG inclui evento"
                  assert "javascript:" not in value.lower(), "SVG inclui JS"
                  if key in {"href", "src"}:
                      assert value.startswith("#") or value.startswith("data:image/"), "Referência externa no SVG"
          print("Logotipo corporativo SVG validado")
          PY
          then
            cp "$BRAND_TMP" public-site/fluxo-caixa-diretoria/assets/logo-pr.svg
            echo "Logotipo oficial P&R incorporado ao Pages"
          else
            echo "::warning::Logo externo indisponível: interface usará endereço de origem ou fallback P&R"
          fi
          rm -f "$BRAND_TMP"

          printf '%s\n' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>P&R Automação Industrial — Fluxo de Caixa</title><body><h1>P&R Automação Industrial</h1><p>Recursos da interface Fluxo de Caixa - Diretoria. Acesso financeiro somente via Sankhya.</p></body></html>' > public-site/index.html
          touch public-site/.nojekyll
          echo 'Arquivos enviados publicamente:'
          find public-site -type f -maxdepth 4 -print
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato com somente arquivos aprovados
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
